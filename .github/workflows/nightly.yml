name: Nightly

# 13:00 UTC = 18:30 IST, ~3h after the 15:30 NSE close so Yahoo has settled.
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m jobs.nightly
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          databaseURL: ${{ secrets.DATABASE_URL }}
